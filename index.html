<style>

<title>TDSH 193 爆炸圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#e6edef; --bg2:#d3dfe2; --panel:rgba(255,255,255,.92); --ink:#12262b; --muted:#587076;
  --line:#c9d7da; --accent:#1B98A6; --accent-ink:#0b6571; --hl:#e8892a; --chip:#eef4f5;
  --grid1:#9fb4b9; --grid2:#c4d3d6;
  --f-disp:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1618; --bg2:#15242a; --panel:rgba(20,32,36,.93); --ink:#dfeef0; --muted:#89a2a7;
    --line:#26393e; --accent:#2fb1bf; --accent-ink:#86d8e0; --hl:#f39a3c; --chip:#1b2c31;
    --grid1:#2d4449; --grid2:#1c2d31;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1618; --bg2:#15242a; --panel:rgba(20,32,36,.93); --ink:#dfeef0; --muted:#89a2a7;
  --line:#26393e; --accent:#2fb1bf; --accent-ink:#86d8e0; --hl:#f39a3c; --chip:#1b2c31;
  --grid1:#2d4449; --grid2:#1c2d31;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 20%,var(--bg) 0%,var(--bg2) 100%);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto minmax(0,1fr);height:100%;width:100%}
#app.nolist{grid-template-columns:minmax(0,1fr) 0}
#app.nolist #side{display:none}
#view{grid-column:1;grid-row:3;position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 11px/1 var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px 5px;white-space:nowrap;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.lbl.flash{animation:lblflash .45s ease-in-out 5}
@keyframes lblflash{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.45);box-shadow:0 0 0 6px rgba(232,137,42,.35)}}
.row.flash{animation:rowflash .5s ease-in-out 4}
@keyframes rowflash{50%{background:var(--hl);color:#1b1206}}
@media (prefers-reduced-motion:reduce){.lbl.flash,.row.flash{animation:none}}
.lbl.sel{background:var(--hl);color:#1b1206;border-color:var(--hl)}

header{grid-column:1 / -1;grid-row:1;position:relative;padding:12px 16px 10px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:auto}
.brand{pointer-events:auto}
.brand .eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--accent-ink);text-transform:uppercase}
.brand h1{margin:2px 0 0;font:700 30px/1 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.hdr-btns{display:flex;gap:8px;pointer-events:auto}

button,.btn{font:600 13px/1 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--chip);border-color:var(--accent);color:var(--accent-ink)}

#dock{position:absolute;left:16px;bottom:16px;width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline}
.sl-top label{font:700 15px/1 var(--f-disp);letter-spacing:.04em}
.sl-top output{font:600 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow button{padding:8px 10px;font-size:12px}
  #dock{position:absolute}
  .dockmin{position:absolute;top:8px;right:8px;padding:4px 9px;font-size:13px;line-height:1}
  #dock.mini .pane, #dock.mini .hint{display:none!important}
  #dock.mini{width:auto;padding:8px 44px 8px 10px}
  details#capDet summary{cursor:pointer;font:600 13px var(--f-body);color:var(--accent-ink);padding:2px 0}
  details#capDet[open] .capcap{max-height:28vh;overflow:auto;margin-top:6px}
  .lg{display:inline-flex;gap:4px;align-items:center;margin-left:6px}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}
  .chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  #side.collapsed{display:none}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-2px 0 2px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;font:700 14px var(--f-disp);letter-spacing:.04em;color:var(--muted)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .pane{display:flex;flex-direction:column;gap:10px}
  .capcap{font-size:12px;line-height:1.55;color:var(--muted)}
  .capcap b{color:var(--ink);font-weight:600}
  .capcap .st{display:inline-block;font:600 11px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--accent-ink);margin-right:4px}
  #capLegend{position:absolute;top:8px;left:8px;z-index:6;max-width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px 8px;font-size:11.5px;line-height:1.5;backdrop-filter:blur(6px)}
  #capLegend button{background:none;border:none;padding:2px 0;font:700 12px var(--f-body);color:var(--accent-ink)}
  #capLegend.min #lgBody{display:none}
  #lgBody .lgk{cursor:pointer;border-radius:6px}
  #lgBody .lgk:hover{background:var(--chip)}
  #lgBody div{display:flex;gap:6px;align-items:flex-start}
  #lgBody i{flex:0 0 10px;height:10px;border-radius:3px;margin-top:4px}
  #czLbl{position:absolute;right:10px;transform:translate(0,-50%);font:600 12px var(--f-body);background:#1B98A6;color:#fff;border:none;border-radius:6px;padding:6px 10px;white-space:nowrap;cursor:pointer;z-index:7}
  #bpLbl{position:absolute;right:10px;transform:translate(0,-50%);font:600 12px var(--f-body);background:#f08a24;color:#1b1206;border:none;border-radius:6px;padding:6px 10px;white-space:nowrap;cursor:pointer;z-index:7}
  #dpLbl{position:absolute;right:10px;transform:translate(0,-50%);font:600 12px var(--f-body);background:#ff3b2f;color:#fff;border:none;border-radius:6px;padding:6px 10px;white-space:nowrap;cursor:pointer;z-index:7}
  #leaders{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
  .oilLbl{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--f-body);background:var(--panel);color:var(--ink);border:1px solid #e8b64a;border-radius:6px;padding:2px 6px;pointer-events:none;white-space:nowrap}
  .oilLbl.hot{background:#e5482b;border-color:#e5482b;color:#fff}
#stepcap{font-size:12px;color:var(--muted);min-height:1.3em}
#stepcap b{color:var(--ink);font-weight:600}
.hint{font-size:11px;color:var(--muted)}

#side{grid-column:2;grid-row:2 / 4;position:relative;padding:0 16px 16px 0;min-height:0;display:flex;flex-direction:column;gap:10px}
#info,#list{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#info{grid-column:1;grid-row:2;position:relative;margin:0 16px 10px;z-index:5;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hl);border-radius:12px;padding:12px 44px 12px 16px;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.12);display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 20px;align-items:start}
#info .no{font:700 44px/1 var(--f-disp);color:var(--accent-ink);white-space:nowrap}
#info .names h2{margin:0 0 3px;font-size:18px;font-weight:700;line-height:1.3}
#info .names .en{font-size:13px;color:var(--muted)}
#info .fld{display:flex;flex-direction:column;gap:2px;min-width:0}
#info .fld span{font-size:11px;letter-spacing:.06em;color:var(--muted)}
#info .fld b{font:600 15px/1.35 var(--f-mono);word-break:break-all}
#info .qty b{font:700 26px/1 var(--f-disp)}
#info .note{grid-column:1 / -1;font-size:12.5px;line-height:1.55;color:var(--ink);opacity:.85;border-top:1px dashed var(--line);padding-top:6px}
#info .x{position:absolute;top:8px;right:8px;padding:4px 9px;font-size:13px;line-height:1}
#list{flex:1;min-height:0;display:flex;flex-direction:column}
#list .lh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#list .lh strong{font:700 15px var(--f-disp);letter-spacing:.04em;white-space:nowrap}
#q{flex:1;min-width:0;font:13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
#rows{overflow:auto;flex:1}
.lh.kit{padding:6px 12px;font-size:12px;color:var(--muted)}
.lh.kit select{flex:1;min-width:0;font:13px var(--f-body);padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;align-items:baseline}
.row:hover{background:var(--chip)}
.row.sel{background:var(--chip);box-shadow:inset 3px 0 0 var(--hl)}
.row .n{font:600 12px var(--f-mono);color:var(--accent-ink)}
.row .q{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
#closeList{display:none}
#listBtn{display:inline-block}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(12px,12px)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:600 14px var(--f-mono);color:var(--muted)}

@media (max-width:760px){
  header{padding:8px 12px 6px}
  .brand .eyebrow{display:none}
  .brand h1{font-size:19px}
  .brand p{display:none}
  .hdr-btns{gap:6px}
  .hdr-btns button{padding:8px 10px;font-size:12.5px}
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;grid-column:auto;grid-row:auto;left:8px;right:8px;bottom:8px;padding:0;max-height:55%;display:none;z-index:15}
  #side.open{display:flex}
  #closeList{display:inline-block}
  #listBtn{display:inline-block}
  #info{margin:0 8px 6px;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:8px 36px 8px 10px}
  #info .no{font-size:30px}
  #info .names h2{font-size:15px}
  #info .names .en{font-size:11.5px}
  #info .fld.pn{grid-column:2 / 4}
  #info .fld b{font-size:13px}
  #info .qty b{font-size:20px}
  #info .note{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  #info .note.open{display:block;-webkit-line-clamp:unset}
  #dock{left:8px;right:8px;bottom:8px;width:auto;padding:8px 10px;gap:8px}
  #dock .btnrow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  #dock .btnrow::-webkit-scrollbar{display:none}
  #dock .btnrow button{flex:0 0 auto;min-height:38px;padding:8px 12px;font-size:13px}
  .tab{padding:8px 12px;font-size:15px}
  .dockmin{top:6px;right:6px;padding:8px 12px}
  #stepcap{font-size:11.5px}
  .hint{display:none}
  details#capDet[open] .capcap{max-height:22vh}
  .chk{font-size:12px}
  .lbl{font-size:10px;padding:2px 4px}
  input[type=range]{height:28px}
}

@media (prefers-reduced-motion:reduce){.lbl{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="eyebrow">Frick · Service Parts List S70-250 · Fig. 4</div>
      <h1>TDSH 193 螺旋壓縮機</h1>
      <p>3D 爆炸圖・依原廠零件表編號（示意比例，非實際尺寸）</p>
    </div>
    <div class="hdr-btns">
      <button id="listBtn" type="button">零件表</button>
      <button id="resetView" type="button">重設視角</button>
    </div>
  </header>
  <section id="info" hidden aria-live="polite"></section>
  <div id="view">
    <div id="stage"></div>
    <div id="labels"></div>
    <div id="loading">載入 3D 模型…</div>
    <svg id="leaders" aria-hidden="true"><line id="bpLine" stroke="#f08a24" stroke-width="1.6" stroke-dasharray="4 3" visibility="hidden"/><circle id="bpDot" r="5" fill="#f08a24" stroke="#fff" stroke-width="1.5" visibility="hidden"/><line id="czLine" stroke="#1B98A6" stroke-width="1.6" stroke-dasharray="4 3" visibility="hidden"/><circle id="czDot" r="5" fill="#1B98A6" stroke="#fff" stroke-width="1.5" visibility="hidden"/><line id="dpLine" stroke="#ff3b2f" stroke-width="1.6" stroke-dasharray="4 3" visibility="hidden"/><circle id="dpDot" r="5" fill="#ff3b2f" stroke="#fff" stroke-width="1.5" visibility="hidden"/></svg>
    <button type="button" id="bpLbl" hidden>回流槽 ⓘ</button>
    <div id="capLegend" hidden><button type="button" id="lgTog" aria-expanded="true">圖例 ▾</button><div id="lgBody"></div></div>
    <button type="button" id="czLbl" hidden></button>
    <button type="button" id="dpLbl" hidden></button>

    <div class="tabs" role="tablist"><button type="button" id="tabEx" class="tab on" role="tab" aria-selected="true">拆解</button><button type="button" id="tabCap" class="tab" role="tab" aria-selected="false">加卸載原理</button></div>
    <div id="paneEx" class="pane">

    <input id="ex" type="range" min="0" max="1000" value="0">
    <div id="stepcap"></div>
    <div class="btnrow" id="stepBtns" hidden><button id="bPrev" type="button">◀ 上一步</button><button id="bNext" type="button" class="primary">下一步 ▶</button></div>
    <div class="btnrow">
      <button id="bExplode" class="primary" type="button">拆解</button>
      <button id="bAssemble" type="button">組合</button>
      <button id="bSeq" type="button" aria-pressed="false">依序拆解</button>
      <button id="bXray" type="button" aria-pressed="false">透視外殼</button>
      <button id="bSpin" type="button" aria-pressed="false">轉子運轉</button>
      <button id="bLbl" type="button" aria-pressed="true" class="on">編號</button>

      <button id="bCut" type="button" aria-pressed="false" title="殼體沿中心剖開">剖面</button>
    </div>
    </div>
    <div id="paneCap" class="pane" hidden>
      <div class="sl-top"><label for="cap">容量（滑閥位置）</label><output id="capOut">100%</output></div>
      <input id="cap" type="range" min="10" max="100" value="100">
      <div class="sl-top"><label for="vi">Vi（滑閥止擋位置）</label><output id="viOut">2.2</output></div>
      <input id="vi" type="range" min="22" max="50" value="22">
      <div class="btnrow"><button id="bCycle" type="button" aria-pressed="false">自動加卸載示範</button></div>
      <details id="capDet"><summary>原理說明</summary><div id="capcap" class="capcap"></div></details>
      <label class="chk"><input type="checkbox" id="capLbl" checked> 在模型上顯示油室／回流槽標註</label>

  </div>

  </div>
  <aside id="side">
    <section id="list">

      <div id="rows"></div>
    </section>
  </aside>
  <div id="tip" hidden></div>
</div>

const allMats = [];
function mat(kind){
  const m = new THREE.MeshStandardMaterial({...MAT[kind],side:THREE.DoubleSide});

/* ---------------- 幾何工具（軸向沿 X） ---------------- */
const TAU = Math.PI*2;
function circ(r){const s=new THREE.Shape();s.absarc(0,0,r,0,TAU,false);return s;}
function holeC(s,r,cx=0,cy=0){const p=new THREE.Path();p.absarc(cx,cy,r,0,TAU,true);s.holes.push(p);return s;}
function annulus(od,id){const s=circ(od/2); if(id>0) holeC(s,id/2); return s;}
function extrudeX(shape,x0,x1,seg=56){
  const g=new THREE.ExtrudeGeometry(shape,{depth:x1-x0,bevelEnabled:false,curveSegments:seg});
  g.rotateY(-Math.PI/2); g.translate(x1,0,0); return g;
}
function ringM(od,id,x0,x1,kind,zc=0,yc=0){const m=new THREE.Mesh(extrudeX(annulus(od,id),x0,x1),mat(kind));m.position.set(0,yc,zc);return m;}
function cylX(r,x0,x1,kind,zc=0,yc=0,seg=40){const g=new THREE.CylinderGeometry(r,r,x1-x0,seg);g.rotateZ(Math.PI/2);g.translate((x0+x1)/2,yc,zc);return new THREE.Mesh(g,mat(kind));}
function torusX(R,r,x,kind,zc=0,arc=TAU){const g=new THREE.TorusGeometry(R,r,10,72,arc);g.rotateY(Math.PI/2);g.translate(x,0,zc);return new THREE.Mesh(g,mat(kind));}
function rrect(z0,z1,y0,y1,r){const s=new THREE.Shape();s.moveTo(z0+r,y0);s.lineTo(z1-r,y0);s.quadraticCurveTo(z1,y0,z1,y0+r);s.lineTo(z1,y1-r);s.quadraticCurveTo(z1,y1,z1-r,y1);s.lineTo(z0+r,y1);s.quadraticCurveTo(z0,y1,z0,y1-r);s.lineTo(z0,y0+r);s.quadraticCurveTo(z0,y0,z0+r,y0);return s;}
// 多圓聯集外框（各圓皆包含原點 → 對原點星形）
function outlinePts(circles,off=0,n=200){
  const pts=[];
  for(let i=0;i<n;i++){const a=TAU*i/n,dx=Math.cos(a),dy=Math.sin(a);let best=0;
    for(const [cz,cy,r0] of circles){const r=r0+off;const dc=dx*cz+dy*cy;const disc=dc*dc-(cz*cz+cy*cy)+r*r;if(disc>=0)best=Math.max(best,dc+Math.sqrt(disc));}
    pts.push([dx*best,dy*best]);}
  return pts;
}
const unionPts=(c1,r1,c2,r2,off=0)=>outlinePts([[c1[0],c1[1],r1],[c2[0],c2[1],r2]],off);
function shapeFrom(pts){const s=new THREE.Shape();pts.forEach(([z,y],i)=>i?s.lineTo(z,y):s.moveTo(z,y));s.closePath();return s;}
function pathFrom(pts){const h=new THREE.Path();[...pts].reverse().forEach(([z,y],i)=>i?h.lineTo(z,y):h.moveTo(z,y));h.closePath();return h;}
function roundShape(R,cy){const s=new THREE.Shape();s.absarc(0,cy,R,0,TAU,false);return s;}
function bearing(od,id,x0,x1,type,zc){
  const g=new THREE.Group(), t=(od-id)*0.17, w=x1-x0;
  g.add(ringM(od,od-2*t,x0,x1,'race',zc));
  g.add(ringM(id+2*t,id,x0,x1,'race',zc));
  const pr=(od+id)/4, rr=((od-id)/2-2*t)*0.5, n=type==='ball'?16:18;
  const geo = type==='ball'? new THREE.SphereGeometry(rr*1.05,16,12) : (()=>{const c=new THREE.CylinderGeometry(rr,rr,w*0.72,16);c.rotateZ(Math.PI/2);return c;})();
  const m=mat('bearing');
  for(let i=0;i<n;i++){const a=TAU*i/n;const e=new THREE.Mesh(geo,m);e.position.set((x0+x1)/2,Math.cos(a)*pr,zc+Math.sin(a)*pr);g.add(e);}
  // 保持架
  g.add(ringM(pr*2+rr*0.6,pr*2-rr*0.6,x0+w*0.1,x0+w*0.16,'bronze',zc));
  g.add(ringM(pr*2+rr*0.6,pr*2-rr*0.6,x1-w*0.16,x1-w*0.1,'bronze',zc));
  return g;
}

const boltGeoCache={};
function boltGeo(d,L){

}

addEventListener('resize',onResize);
new ResizeObserver(onResize).observe(stage);
resetView(); document.getElementById('loading').remove();
requestAnimationFrame(frame);
setTimeout(()=>{target=1;animating=true;},700);
</script>
